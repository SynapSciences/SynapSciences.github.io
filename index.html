<!DOCTYPE html>
<html>
<head>
    <title>SynapSciences</title>

    <style>
        body {
            font-family: Arial;
            margin: 0;
            background-color: #f5f7fa;
            text-align: center;
            font-size: 20px;
        }

        .header-bg {
            background-image: url('neurone_4.jpg');
            background-size: cover;
            background-position: center;
            height: 250px;
            position: relative;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 55px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
        }

        .content {
            padding: 40px;
        }

        .social-buttons {
            margin-top: 40px;
            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
        }

        .social-buttons a {
            width: 60px;
            height: 60px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        
            background-color: #f5f7fa; 
        
            border-radius: 12px;
        
            box-shadow: 
                4px 4px 10px rgba(0,0,0,0.1),
                -4px -4px 10px rgba(255,255,255,0.8);
        
            transition: all 0.2s ease;
        }

        .social-buttons a:hover {
            box-shadow: 
                inset 2px 2px 5px rgba(0,0,0,0.15),
                inset -2px -2px 5px rgba(255,255,255,0.7);
        }
        
        .social-icon {
            width: 50px;
            height: 50px;
            object-fit: contain; 
        }

        .social-icon:hover {
            transform: scale(1.1);
        }

        .main-button {
            display: inline-block;
            padding: 15px 100px;
            /* Remplacer le background-color par l'image */
            background-image: url('biais cognitifs/biais_bg.png');
            background-size: cover;       /* L'image couvre tout le bouton */
            background-position: center;  /* Centrer l'image */
            color: white;                 /* Couleur du texte */
            text-decoration: none;
            font-size: 20px;
            font-weight: bold;
            border-radius: 8px;
            transition: all 0.2s ease;
            border: none;                 /* Supprime la bordure par défaut */
        }
        
        .main-button:hover {
            opacity: 0.8; /* Légère transparence au survol pour effet */
        }

        footer {
            padding: 20px;
        }
    </style>
</head>

<body>

<header>
    <div class="header-bg">
        <div class="overlay">
            Synapsciences
        </div>
    </div>
</header>

<div class="content">
    <h2>Bienvenue</h2>
    <p>On explique le cerveau simplement 🧠</p>

    <div class="social-buttons">
        <a href="https://github.com/synapsciences">
            <img src="github.png" class="social-icon">
        </a>
        <a href="https://instagram.com/synapsciences">
            <img src="instagram.png" class="social-icon">
        </a>
        <a href="https://www.linkedin.com/company/synapsciences/">
            <img src="linkedin.png" class="social-icon">
        </a>
        <a href="https://linktr.ee/synapsciences">
            <img src="linktree.png" class="social-icon">
        </a>
        <a href="contact.html">
            <img src="contact.png" class="social-icon">
        </a>
    </div>
    <div style="margin-top: 30px;">
    <a href="biais_cognitifs.html" class="main-button">Biais cognitifs</a>
</div>
</div>

<footer>
    <img src="Logo SynapSciences.png" width="120">
</footer>

</body>
</html>
