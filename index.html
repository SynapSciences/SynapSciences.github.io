<!DOCTYPE html>
<html>
<head>
    <title>Synapsciences</title>

    <style>
        body {
            font-family: Arial;
            margin: 0;
            background-color: #f5f7fa;
            text-align: center;
        }

        /* HEADER IMAGE */
        .header-bg {
            background-image: url('assets/neurone_4.jpg');
            background-size: cover;
            background-position: center;
            height: 250px;
            position: relative;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 48px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
        }

        .content {
            padding: 40px;
        }

        .social-buttons {
            margin-top: 20px;
        }

        .social-buttons a {
            margin: 0 10px;
            display: inline-block;
        }

        .social-icon {
            width: 50px;
            height: 50px;
            transition: transform 0.2s;
        }

        .social-icon:hover {
            transform: scale(1.1);
        }

        /* FOOTER */
        footer {
            padding: 20px;
        }
    </style>
</head>

<body>

<header>
    <div class="header-bg">
        <div class="overlay">
            Synapsciences
        </div>
    </div>
</header>

<div class="content">
    <h2>Bienvenue</h2>
    <p>On explique le cerveau simplement 🧠</p>

    <div class="social-buttons">
        <a href="https://github.com/synapsciences">
            <img src="assets/github.png" class="social-icon">
        </a>
        <a href="https://instagram.com/synapsciences">
            <img src="assets/insta.avif" class="social-icon">
        </a>
        <a href="https://linkedin.com/in/synapsciences">
            <img src="assets/linkedin.png" class="social-icon">
        </a>
        <a href="https://linktr.ee/synapsciences">
            <img src="assets/linktree.png" class="social-icon">
        </a>
        <a href="contact.html">
            <img src="assets/contact.png" class="social-icon">
        </a>
    </div>
</div>

<footer>
    <img src="assets/logo.png" width="120">
</footer>

</body>
</html>
