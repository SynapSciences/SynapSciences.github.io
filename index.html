<!DOCTYPE html>
<html>

    <title>SynapSciences</title>

    <style>
        body {
            font-family: Arial;
            margin: 0;
            background-color: #f5f7fa;
            text-align: center;
            font-size: 20px;
        }

        header {
            height: 20vh; 
        }
        
        .header-bg {
            background-image: url('neurone_4.jpg');
            background-size: cover;
            background-position: center;
            height: 100%;
            position: relative;
        }
        
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column; 
            align-items: center;
            justify-content: center; 
            color: white;
            text-align: center;
            padding: 20px 0; 
            box-sizing: border-box; 
        }
        
        .overlay h1 {
            font-size: 55px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
            margin: 0;
        }
        
        .overlay img {
            width: clamp(150px, 40vw, 400px);
            height: auto;
            margin-top: 10px;
        }

        .content {
            padding: 40px;
        }

        .social-buttons {
            margin-top: 40px;
            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
        }

        .social-buttons a {
            width: 60px;
            height: 60px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        
            background-color: #f5f7fa; 
        
            border-radius: 12px;
        
            box-shadow: 
                4px 4px 10px rgba(0,0,0,0.1),
                -4px -4px 10px rgba(255,255,255,0.8);
        
            transition: all 0.2s ease;
        }

        .social-buttons a:hover {
            box-shadow: 
                inset 2px 2px 5px rgba(0,0,0,0.15),
                inset -2px -2px 5px rgba(255,255,255,0.7);
        }
        
        .social-icon {
            width: 50px;
            height: 50px;
            object-fit: contain; 
        }

        .social-icon:hover {
            transform: scale(1.1);
        }

        .main-button {
            display: block;
            width: 90%;
            max-width: 900px;
            margin: 30px auto 0 auto;
            padding: 20px 0;
            
            background-image: url('biais_bouton.png');
            background-size: cover;
            background-position: center; 
            
            color: white;
            font-size: 24px;
            font-weight: bold;
            text-decoration: none;
            border-radius: 12px;
            border: none;
            transition: all 0.2s ease;
            text-align: center;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
        }
        
        .main-button:hover {
            opacity: 0.85;
        }

        .main-button-femmes {

            background-position: center;

            border: none;

            text-align: center;

        }
