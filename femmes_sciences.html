<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Femmes en Sciences - SynapSciences</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            text-align: center;
            background-color: #f5f7fa;
        }

        html, body {
            margin: 0;
            padding: 0;
            height: 100%; 
        }
        
        
        header {
            position: relative;
            min-height: 20vh;
            height: 20vh;
            background-image: url('FS/fs_bg(1).png');
            background-size: cover;
            background-position: center;
            overflow: hidden;
        }
        
        .header-overlay {
            left: 0;
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center; 
            align-items: center;
            text-align: center;
            color: white;
        }
        
        .header-overlay h1 {
            font-size: 55px;
            font-weight: bold;
            margin: 0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
            margin-top: 10px;
        }
        
        .header-overlay img {
            width: 300px;
            height: auto;
            margin-top: 5px;
        }
        .section {
            padding: 50px 20px;
        }
        .section h2 {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .section p {
            font-size: 18px;
            max-width: 800px;
            margin: 0 auto 30px auto;
        }

        .image-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
        }
        .image-grid img {
            width: 150px;
            height: 150px;
            object-fit: cover;
            cursor: pointer;
            border-radius: 8px;
            transition: transform 0.2s ease;
        }
        .image-grid img:hover {
            transform: scale(1.05);
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 10;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.8);
            align-items: center;
            justify-content: center;
        }
        .modal img {
            max-width: 90%;
            max-height: 90%;
            border-radius: 8px;
        }

        .modal .close-btn {
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 40px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            text-shadow: 2px 2px 6px rgba(0,0,0,0.7);
            z-index: 20;
        }

        .modal .close-btn {
            font-size: 50px;
            top: 15px;
            right: 20px;
        }

        .modal {
            transition: opacity 0.3s ease;
        }

        .modal .prev,
        .modal .next {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            color: white;
            font-size: 50px;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
            padding: 10px;
            text-shadow: 2px 2px 6px rgba(0,0,0,0.7);
            z-index: 20;
        }
        
        .modal .prev { left: 20px; }
        .modal .next { right: 20px; }

    </style>
</head>
<body>
    
<header>

<div id="modal1" class="modal">
    <span class="prev">&#10094;</span>
    <img src="biais cognitifs/Le biais de passéisme/1.png">
    <span class="next">&#10095;</span>
    <span class="close-btn">&times;</span>
</div>
<link rel="preload" as="image" href="logo_synapsciences.png">
<script>
    function generateImages(folderId, folderPath, count) {
        const container = document.getElementById(folderId);
        let currentIndex = 0;
        const modal = document.createElement('div');
        modal.className = "modal";
        const modalImg = document.createElement('img');
        modal.appendChild(modalImg);
        const closeBtn = document.createElement('span');
        closeBtn.className = "close-btn";
        closeBtn.innerHTML = "&times;";
        closeBtn.onclick = () => { modal.style.display = "none"; };
        modal.appendChild(closeBtn);
    
        const prev = document.createElement('span');
        prev.className = "prev";
        prev.innerHTML = "&#10094;";
        modal.appendChild(prev);
        const next = document.createElement('span');
        next.className = "next";
        next.innerHTML = "&#10095;";
        modal.appendChild(next);
    
        document.body.appendChild(modal);
    
        const imgs = [];
        for (let i = 1; i <= count; i++) {
            const img = document.createElement('img');
            img.src = `${folderPath}/${i}.png`;
            img.alt = "";
            img.style.cursor = "pointer";
            container.appendChild(img);
            imgs.push(img.src);
    
            img.onclick = () => {
                currentIndex = i - 1;
                modalImg.src = imgs[currentIndex];
                modal.style.display = "flex";
            }
        }
    
        prev.onclick = () => {
            currentIndex = (currentIndex - 1 + imgs.length) % imgs.length;
            modalImg.src = imgs[currentIndex];
        }
        next.onclick = () => {
            currentIndex = (currentIndex + 1) % imgs.length;
            modalImg.src = imgs[currentIndex];
        }
    }

    generateImages("matilda", "FS/L’effet mathilda", 4);
    generateImages("Nettie Stevens", "FS/Nettie Stevens", 6);
    generateImages("Margaret Rossiter", "FS/Margaret Rossiter", 7);
    generateImages("Matilda Joslyn Gage", "FS/Matilda Joslyn Gage", 7);
    generateImages("Carmen Maldonado-Vlaar", "FS/Carmen Maldonado-Vlaar", 7);
    generateImages("Mary Jacobi", "FS/Mary Jacobi", 9);
    generateImages("Constance Pascal", "FS/Constance Pascal", 6);
    generateImages("Madeleine Pelletier", "FS/Madeleine Pelletier", 7);
    generateImages("Dr. Omowumi Femi-Akinlosotu", "FS/Dr. Omowumi Femi-Akinlosotu", 5);
</script>
