<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Biais Cognitifs - SynapSciences</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            text-align: center;
            background-color: #f5f7fa;
        }

        header {
            height: 33vh; /* 1/3 de la page */
            background-image: url('biais cognitifs/biais_bg.png');
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: center; /* centre horizontalement */
            align-items: center;     /* centre verticalement */
        }
        
        .header-content {
            display: flex;
            flex-direction: column;
            align-items: center;    /* centre horizontalement le contenu */
            gap: 20px;              /* espace entre titre et logo */
        }
        
        header h1 {
            font-size: 55px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
            margin: 0;
        }
        
        header img {
            width: clamp(150px, 40vw, 400px);
            height: auto;
        }
        .section {
            padding: 50px 20px;
        }
        .section h2 {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .section p {
            font-size: 18px;
            max-width: 800px;
            margin: 0 auto 30px auto;
        }

        .image-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
        }
        .image-grid img {
            width: 150px;
            height: 150px;
            object-fit: cover;
            cursor: pointer;
            border-radius: 8px;
            transition: transform 0.2s ease;
        }
        .image-grid img:hover {
            transform: scale(1.05);
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 10;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.8);
            align-items: center;
            justify-content: center;
        }
        .modal img {
            max-width: 90%;
            max-height: 90%;
            border-radius: 8px;
        }

        .modal .close-btn {
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 40px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            text-shadow: 2px 2px 6px rgba(0,0,0,0.7);
            z-index: 20;
        }

        .modal .close-btn {
            font-size: 50px;
            top: 15px;
            right: 20px;
        }

        .modal {
            transition: opacity 0.3s ease;
        }

    </style>
</head>
<body>

<header>
    <div class="header-content">
        <h1>Biais cognitifs</h1>
        <img src="logo_synapsciences.png" alt="Logo SynapSciences">
    </div>
</header>

<!-- Section Biais de passéisme -->
<div class="section">
    <h2>Biais de passéisme</h2>
    <p>Le biais de passéisme est le bias....</p>
    <div id="passeisme" class="image-grid"></div>
</div>

<!-- Section Biais d'autorité -->
<div class="section">
    <h2>Biais d'autorité</h2>
    <p>Le biais d'autorité est le bias....</p>
    <div id="autorite" class="image-grid"></div>
</div>

<!-- Section Biais de statu quo -->
<div class="section">
    <h2>Biais de statu quo</h2>
    <p>Le biais de statu quo est le bias....</p>
    <div id="statuquo" class="image-grid"></div>
</div>

<script>
    // Fonction pour générer les images automatiquement
    function generateImages(folderId, folderPath, count) {
    const container = document.getElementById(folderId);
    for (let i = 1; i <= count; i++) {
        const imgName = i + ".png"; 
        const img = document.createElement('img');
        img.src = folderPath + "/" + imgName;
        img.alt = "";
        container.appendChild(img);

        // Crée le modal
        const modal = document.createElement('div');
        modal.id = folderId + i;
        modal.className = "modal";

        // Croix de fermeture
        const closeBtn = document.createElement('span');
        closeBtn.className = "close-btn";
        closeBtn.innerHTML = "&times;";
        closeBtn.onclick = () => { modal.style.display = "none"; };

        const modalImg = document.createElement('img');
        modalImg.src = folderPath + "/" + imgName;

        modal.appendChild(closeBtn);
        modal.appendChild(modalImg);
        document.body.appendChild(modal);

        // Affiche le modal au clic sur l'image
        img.onclick = () => { modal.style.display = "flex"; };
    }
}
    // Générer automatiquement les images
    generateImages("passeisme", "biais cognitifs/Le biais de passéisme", 6);
    generateImages("autorite", "biais cognitifs/Biais d'autorité", 6);
    generateImages("statuquo", "biais cognitifs/Biais de statu quo", 6);
</script>

</body>
</html>
