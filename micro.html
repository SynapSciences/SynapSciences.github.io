<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>La Microscopie - SynapSciences</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            text-align: center;
            background-color: #f5f7fa;
        }

        
        header {
            height: 20vh; 
            margin-bottom: 0;
        }
        
        .header-bg {
            background-image: url('micro/micro_bg.png');
            background-size: cover;
            background-position: center;
            height: 100%;
            position: relative;
        }
        
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column; 
            align-items: center;
            justify-content: center; 
            color: white;
            text-align: center;
            padding: 0; 
            box-sizing: border-box; 
        }
        
        .overlay h1 {
            font-size: 55px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
            margin: 0;
        }
        
        .overlay img {
            width: clamp(150px, 40vw, 400px);
            height: auto;
            margin-top: 10px;
        }
        .section {
            padding: 30px 20px;
        }
        .section h2 {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .section p {
            font-size: 18px;
            max-width: 800px;
            margin: 0 auto 30px auto;
        }

        .image-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
        }
        .image-grid img {
            width: 150px;
            height: 150px;
            object-fit: cover;
            cursor: pointer;
            border-radius: 8px;
            transition: transform 0.2s ease;
        }
        .image-grid img:hover {
            transform: scale(1.05);
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 10;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.8);
            align-items: center;
            justify-content: center;
        }
        .modal img {
            max-width: 90%;
            max-height: 90%;
            border-radius: 8px;
        }

        .modal .close-btn {
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 40px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            text-shadow: 2px 2px 6px rgba(0,0,0,0.7);
            z-index: 20;
        }

        .modal .close-btn {
            font-size: 50px;
            top: 15px;
            right: 20px;
        }

        .modal {
            transition: opacity 0.3s ease;
        }

        .modal .prev,
        .modal .next {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            color: white;
            font-size: 50px;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
            padding: 10px;
            text-shadow: 2px 2px 6px rgba(0,0,0,0.7);
            z-index: 20;
        }
        
        .modal .prev { left: 20px; }
        .modal .next { right: 20px; }

        .content img {
            display: block;
            margin: 0 auto;
        }

    </style>
</head>
    
<header>
    <div class="header-bg">
        <div class="overlay">
            <h1>La Microscopie</h1>
        </div>
    </div>
</header>
    
<body>
<div class="content">
    <img src="logo_synapsciences.png" width="400">
    </div>
    
<!-- Confocal -->
<div class="section">
    <h2>La microscopie confocale et la microscopie à feuille de lumière</h2>
    <p> </p>
    <div id="confocal" class="image-grid"></div>
</div>

<!-- Electronique -->
<div class="section">
    <h2>La microscopie électronique</h2>
    <p> </p>
    <div id="electronique" class="image-grid"></div>
</div>

<!-- Super-resolution -->
<div class="section">
    <h2>La microscopie super-résolution</h2>
    <p> </p>
    <div id="super-reso" class="image-grid"></div>
</div>

<!-- Video-microscopie -->
<div class="section">
    <h2>La vidéo-microscopie</h2>
    <p> </p>
    <div id="video" class="image-grid"></div>
</div>

<div id="modal1" class="modal">
    <span class="prev">&#10094;</span>
    <img src="biais cognitifs/Le biais de passéisme/1.png">
    <span class="next">&#10095;</span>
    <span class="close-btn">&times;</span>
</div>
    
<link rel="preload" as="image" href="logo_synapsciences.png">
<script>
function generateImages(folderId, folderPath, count, videoIndexes = []) {
    const container = document.getElementById(folderId);
    let currentIndex = 0;

    // MODAL
    const modal = document.createElement('div');
    modal.className = "modal";

    const modalContent = document.createElement('div');
    modal.appendChild(modalContent);

    const closeBtn = document.createElement('span');
    closeBtn.className = "close-btn";
    closeBtn.innerHTML = "&times;";
    closeBtn.onclick = () => modal.style.display = "none";
    modal.appendChild(closeBtn);

    const prev = document.createElement('span');
    prev.className = "prev";
    prev.innerHTML = "&#10094;";
    modal.appendChild(prev);

    const next = document.createElement('span');
    next.className = "next";
    next.innerHTML = "&#10095;";
    modal.appendChild(next);

    document.body.appendChild(modal);

    const files = [];

    // CRÉATION DES ÉLÉMENTS
    for (let i = 1; i <= count; i++) {
        let element;
        let src;

        if (videoIndexes.includes(i)) {
            src = `${folderPath}/${i}.mp4`;

            element = document.createElement('video');

            const source = document.createElement('source');
            source.src = src;
            source.type = "video/mp4";
            
            element.appendChild(source);
            
            element.muted = true;
            element.loop = true;
            element.autoplay = true;
            element.playsInline = true;
        } else {
            src = `${folderPath}/${i}.png`;

            element = document.createElement('img');
            element.src = src;
        }

        // STYLE UNIFIÉ
        element.style.width = "150px";
        element.style.height = "150px";
        element.style.objectFit = "cover";
        element.style.borderRadius = "8px";
        element.style.cursor = "pointer";
        element.style.transition = "transform 0.2s ease";

        element.onmouseover = () => element.style.transform = "scale(1.05)";
        element.onmouseout = () => element.style.transform = "scale(1)";

        container.appendChild(element);
        files.push(src);

        element.onclick = () => {
            currentIndex = i - 1;
            openModal();
        };
    }

    function openModal() {
        modalContent.innerHTML = "";
        const src = files[currentIndex];

        if (src.endsWith(".mp4")) {
            const video = document.createElement("video");
    
            const source = document.createElement("source");
            source.src = src;
            source.type = "video/mp4";
            
            video.appendChild(source);
            
            video.controls = true;
            video.autoplay = true;
            video.style.maxWidth = "90vw";
            video.style.maxHeight = "90vh";
            video.style.objectFit = "contain";
            
            modalContent.appendChild(video);
        } else {
            const img = document.createElement("img");
            img.src = src;
            img.style.maxWidth = "90vw";
            img.style.maxHeight = "90vh";
            img.style.objectFit = "contain";
            modalContent.appendChild(img);
        }

        modal.style.display = "flex";
    }

    prev.onclick = () => {
        currentIndex = (currentIndex - 1 + files.length) % files.length;
        openModal();
    };

    next.onclick = () => {
        currentIndex = (currentIndex + 1) % files.length;
        openModal();
    };
}

generateImages("confocal", "micro/confocal", 7);
generateImages("electronique", "micro/electronique", 8);
generateImages("super-reso", "micro/super-reso", 9);
generateImages("video", "micro/videomicro", 7, [1, 4]);

</script>
    
</body>
</html>
