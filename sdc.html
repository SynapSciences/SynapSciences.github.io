<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>La Semaine du Cerveau 2026 - SynapSciences</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            text-align: center;
            background-color: #f5f7fa;
        }

        
        header {
            height: 20vh; 
            margin-bottom: 0;
        }
        
        .header-bg {
            background-image: url('sdc/sdc_bg.png');
            background-size: cover;
            background-position: center;
            height: 100%;
            position: relative;
        }
        
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column; 
            align-items: center;
            justify-content: center; 
            color: white;
            text-align: center;
            padding: 0; 
            box-sizing: border-box; 
        }
        
        .overlay h1 {
            font-size: 55px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
            margin: 0;
        }
        
        .overlay img {
            width: clamp(150px, 40vw, 400px);
            height: auto;
            margin-top: 10px;
        }
        .section {
            padding: 30px 20px;
        }
        .section h2 {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .section p {
            font-size: 18px;
            max-width: 800px;
            margin: 0 auto 30px auto;
        }

        .image-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
        }
        .image-grid img {
            width: 150px;
            height: 150px;
            object-fit: cover;
            cursor: pointer;
            border-radius: 8px;
            transition: transform 0.2s ease;
        }
        .image-grid img:hover {
            transform: scale(1.05);
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 10;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.8);
            align-items: center;
            justify-content: center;
        }
        .modal img {
            max-width: 90%;
            max-height: 90%;
            border-radius: 8px;
        }

        .modal .close-btn {
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 40px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            text-shadow: 2px 2px 6px rgba(0,0,0,0.7);
            z-index: 20;
        }

        .modal .close-btn {
            font-size: 50px;
            top: 15px;
            right: 20px;
        }

        .modal {
            transition: opacity 0.3s ease;
        }

        .modal .prev,
        .modal .next {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            color: white;
            font-size: 50px;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
            padding: 10px;
            text-shadow: 2px 2px 6px rgba(0,0,0,0.7);
            z-index: 20;
        }
        
        .modal .prev { left: 20px; }
        .modal .next { right: 20px; }

        .content img {
            display: block;
            margin: 0 auto;
        }

    </style>
</head>
    
<header>
    <div class="header-bg">
        <div class="overlay">
            <h1>La Semaine du Cerveau 2026</h1>
        </div>
    </div>
</header>
    
<body>
<div class="content">
    <img src="logo_synapsciences.png" width="400">
    </div>
    
<!-- Annonce -->
<div class="section">
    <h2></h2>
    <p> </p>
    <div id="annonce" class="image-grid"></div>
</div>

<!-- Alzheimer -->
<div class="section">
    <h2>alzheimer</h2>
    <p> </p>
    <div id="ganzfeld" class="image-grid"></div>
</div>

<!-- Milgram -->
<div class="section">
    <h2>L'expérience de Milgram</h2>
    <p> </p>
    <div id="milgram" class="image-grid"></div>
</div>

<!-- Siffre -->
<div class="section">
    <h2>L'expérience de Siffre</h2>
    <p> </p>
    <div id="siffre" class="image-grid"></div>
</div>

<div id="modal1" class="modal">
    <span class="prev">&#10094;</span>
    <img src="biais cognitifs/Le biais de passéisme/1.png">
    <span class="next">&#10095;</span>
    <span class="close-btn">&times;</span>
</div>
    
<link rel="preload" as="image" href="logo_synapsciences.png">
<script>
    function generateImages(folderId, folderPath, count) {
        const container = document.getElementById(folderId);
        let currentIndex = 0;
        const modal = document.createElement('div');
        modal.className = "modal";
        const modalImg = document.createElement('img');
        modal.appendChild(modalImg);
        const closeBtn = document.createElement('span');
        closeBtn.className = "close-btn";
        closeBtn.innerHTML = "&times;";
        closeBtn.onclick = () => { modal.style.display = "none"; };
        modal.appendChild(closeBtn);
    
        const prev = document.createElement('span');
        prev.className = "prev";
        prev.innerHTML = "&#10094;";
        modal.appendChild(prev);
        const next = document.createElement('span');
        next.className = "next";
        next.innerHTML = "&#10095;";
        modal.appendChild(next);
    
        document.body.appendChild(modal);
    
        const imgs = [];
        for (let i = 1; i <= count; i++) {
            const img = document.createElement('img');
            img.src = `${folderPath}/${i}.png`;
            img.alt = "";
            img.style.cursor = "pointer";
            container.appendChild(img);
            imgs.push(img.src);
    
            img.onclick = () => {
                currentIndex = i - 1;
                modalImg.src = imgs[currentIndex];
                modal.style.display = "flex";
            }
        }
    
        prev.onclick = () => {
            currentIndex = (currentIndex - 1 + imgs.length) % imgs.length;
            modalImg.src = imgs[currentIndex];
        }
        next.onclick = () => {
            currentIndex = (currentIndex + 1) % imgs.length;
            modalImg.src = imgs[currentIndex];
        }
    }

    generateImages("etonnante", "expe/Les expériences bizarres", 3);
    generateImages("ganzfeld", "expe/Ganzfeld", 5);
    generateImages("milgram", "expe/Milgram", 5);
    generateImages("siffre", "expe/Siffre", 5);
    
</script>

</body>
</html>
