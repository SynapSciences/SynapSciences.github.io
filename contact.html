<!DOCTYPE html>
<html>
<head>
    <title>SynapSciences</title>

    <style>
        body {
            font-family: Arial;
            margin: 0;
            background-color: #f5f7fa;
            text-align: center;
            font-size: 20px;
        }

        header {
            height: 20vh; 
        }
        
        .header-bg {
            background-image: url('neurone_4.jpg');
            background-size: cover;
            background-position: center;
            height: 100%;
            position: relative;
        }
        
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column; 
            align-items: center;
            justify-content: center; 
            color: white;
            text-align: center;
            padding: 20px 0; 
            box-sizing: border-box; 
        }
        
        .overlay h1 {
            font-size: 55px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
            margin: 0;
        }
        
        .overlay img {
            width: clamp(150px, 40vw, 400px);
            height: auto;
            margin-top: 10px;
        }

        .content {
            padding: 40px;
        }
      
        footer {
            padding: 20px;
        }
    </style>
</head>
<header>
    <div class="header-bg">
        <div class="overlay">
            <h1>SynapSciences</h1>
        </div>
    </div>
</header>
<body>

<div class="content">
    <h2>Contact</h2>
    <p>Email : synapsciences.marseille@gmail.com</p>
</div>
